# WebSentinel-CS :: Nginx Reverse Proxy with TLS Hardening
# Production reference configuration (daemon binds to 127.0.0.1 with TRUST_PROXIES=true)

upstream websentinel_backend {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sentinel.tuempresa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sentinel.tuempresa.com;

    # TLS Certificates & Cipher Suites (Mozilla Modern)
    ssl_certificate /etc/letsencrypt/live/sentinel.tuempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentinel.tuempresa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers at Edge
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1M;

    location / {
        proxy_pass http://websentinel_backend;
        proxy_http_version 1.1;

        # WebSocket / Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Identity & Proxy Headers (Read by WebSentinel-CS when TRUST_PROXIES=true)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Health check bypass
    location = /healthz {
        proxy_pass http://websentinel_backend;
        access_log off;
    }
}
